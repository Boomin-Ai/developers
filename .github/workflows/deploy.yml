name: Deploy Developers Docs

on:
  # Merging to main deploys. This was dispatch-only, which meant every merge
  # looked shipped but wasn't — the site served 2026-07-10 content while four
  # PRs sat merged and invisible, including a breaking-change note for a
  # package that was already live on npm. Only paths that affect the built
  # site trigger it, so a README tweak doesn't redeploy.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ed6e1910565216eb1092d34eeab7a52e
          command: pages deploy dist --project-name boomin-developers
